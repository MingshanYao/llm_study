<!DOCTYPE html>
<!-- paper-research 报告模板：复制本文件，替换 {{TITLE}} / {{DATE}} / {{CONTENT}} 三个占位符后写入 docs/<slug>.html。
     head 中的内联 CSS 与钉死版本 + SRI 的 CDN 引用必须原样保留，不得更换 CDN、升级版本或去掉 integrity/crossorigin。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei" crossorigin="anonymous" async></script>
<style>
  :root {
    --ink: #1a1f2e; --muted: #5a6272; --line: #e3e7ee;
    --accent: #2456c4; --accent-soft: #eef3fc; --code-bg: #f6f8fa;
    --quote-bg: #f4f7fd; --warn-bg: #fff8e8; --warn-line: #e6c96a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: #fbfbfd;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.75; font-size: 16px;
  }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 1.9em; line-height: 1.35; margin: 0 0 6px; }
  h2 { font-size: 1.4em; margin: 2.2em 0 0.7em; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  h3 { font-size: 1.12em; margin: 1.6em 0 0.5em; color: var(--accent); }
  h4 { font-size: 1.02em; margin: 1.3em 0 0.4em; }
  p, li { color: #2a3040; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .meta {
    color: var(--muted); font-size: 0.9em; background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; margin: 18px 0 8px;
  }
  .meta b { color: var(--ink); }
  .tldr {
    background: var(--quote-bg); border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 14px 20px; margin: 26px 0;
  }
  .tldr p { margin: 6px 0; }
  .infer {
    background: var(--warn-bg); border: 1px dashed var(--warn-line); border-radius: 8px;
    padding: 10px 16px; margin: 14px 0; font-size: 0.95em;
  }
  .infer::before { content: "推断"; font-weight: 700; color: #9a7b1c; margin-right: 8px; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 0.93em; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--accent-soft); }
  tr:nth-child(even) td { background: #fafbfd; }
  table code, li code, p code {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-size: 0.88em;
    font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  pre { margin: 14px 0; padding: 0; }
  pre code {
    display: block; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.55;
    font-size: 0.86em; font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  .cap {
    color: var(--muted); font-size: 0.85em; margin: -6px 0 18px;
  }
  .cap b { color: var(--ink); }
  .fig { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 14px 0; }
  .formula { overflow-x: auto; }
  footer { color: var(--muted); font-size: 0.85em; border-top: 1px solid var(--line); margin-top: 48px; padding-top: 14px; }
  ol.refs li, ul.refs li { margin: 6px 0; }
  .pill {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 1px 10px; font-size: 0.82em; margin-right: 6px;
  }
</style>
</head>
<body>
<main>

{{CONTENT}}

<footer>生成于 {{DATE}} · paper-research 工作流 · 公式由 MathJax 3.2.2 渲染，代码高亮由 highlight.js 11.9.0 提供 · 事实性内容以论文与官方源码为准，推断处已逐条标注</footer>

</main>
<script>hljs.highlightAll();</script>
</body>
</html>
